    validation: random
    validation_line: 20
    issues: []
    note: Uses the Melbourne housing dataset, not this competition's data. Imputer fit on the training split only.
  apapiu__regularized-linear-models/regularized-linear-models.ipynb:
    validation: random
    validation_line: 52
    issues:
      - type: data.leakage.preprocessing_before_split
        line: 41
        note: fillna(all_data.mean()) over train+test before 5-fold CV on the training rows.
    note: Skewness is computed on train only (32); xgb.cv early stopping picks rounds by CV, which is ordinary CV tuning.

    issues: []
    note: Random 70/30 mask split; Id dropped before training.
  serigne__stacked-regressions-top-4-on-leaderboard/stacked-regressions-top-4-on-leaderboard.ipynb:
    validation: random
    validation_line: 262
    issues:
      - type: data.leakage.preprocessing_before_split
        line: 143
        note: LotFrontage filled with per-neighborhood medians over train+test before KFold CV on train; mode fills (161-174) and the skewness-based feature choice (222) also use all rows.

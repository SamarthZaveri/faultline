  blueberry90__notebooka5681cbc1a/notebooka5681cbc1a.ipynb:
    validation: random
    validation_line: 173
    issues:
      - type: data.leakage.test_in_training
        line: 176
        note: Right after the 70/30 split, X_train/y_train are reset to all rows, so every model is trained on X_test and then scored on it.
      - type: data.leakage.feature_selection_full
        line: 223
        note: The top 250 features come from forests fit on all rows.
      - type: data.leakage.resampling_before_split
        line: 157
        note: Negatives are undersampled before the split, so the holdout's class mix is artificial.
      - type: data.fit.metric_mismatch
        line: 254
        note: AUC is computed from hard predictions, alongside accuracy; the competition scores AUC on probabilities.

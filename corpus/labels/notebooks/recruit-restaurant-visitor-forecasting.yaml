      - type: data.leakage.target_derived
        line: 65
        note: Per-store/day-of-week visitor statistics over all training rows are features for the CV.
      - type: data.leakage.preprocessing_before_split
        line: 149
        note: MinMaxScaler fit on train+test value columns before the CV.
    note: The denoising autoencoder is trained on train+test features (transductive).
  aless80__sarimax-on-mean-visits/sarimax-on-mean-visits.ipynb:

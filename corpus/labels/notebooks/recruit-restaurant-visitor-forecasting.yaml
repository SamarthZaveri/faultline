    note: EDA only.
  aharless__exclude-same-wk-res-from-nitin-s-surpriseme2-w-nn/exclude-same-wk-res-from-nitin-s-surpriseme2-w-nn.ipynb:
    validation: none
    issues: []
    note: Reported RMSLEs are on the training rows; Keras validation_split only monitors fixed epochs.
  johannesss__forecasting-using-lstm-from-keras/forecasting-using-lstm-from-keras.ipynb:
    validation: slice
    validation_line: 171
    issues:
      - type: data.leakage.temporal_split
        line: 171
        note: super_data is stacked store by store, so the positional 70/30 cut holds out the last stores over the same dates, not later dates.
      - type: data.leakage.preprocessing_before_split
        line: 102
        note: MinMaxScaler fit on every row before the split.

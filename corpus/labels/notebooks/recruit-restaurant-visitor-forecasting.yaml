competition: recruit-restaurant-visitor-forecasting
labeler: claude-opus-5-5
notebooks:
  yekenot__explore-ts-with-lstm/explore-ts-with-lstm.ipynb:
    validation: temporal
    validation_line: 97
    issues:
      - type: data.leakage.preprocessing_before_split
        line: 92
        note: MinMaxScaler fit on all visitor values (and on all features, 179) before the date-ordered 70/30 split.
      - type: data.leakage.target_derived
        line: 52
        note: Per-store/day-of-week min/mean/median/max visitors over all training rows feed the multivariate LSTM, whose holdout is the last 30% of those rows.

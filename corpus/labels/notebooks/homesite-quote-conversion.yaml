    validation_line: 114
    issues:
      - type: data.leakage.feature_selection_full
        line: 53
        note: SelectKBest(mutual_info_classif) fit on all rows and labels before the folds.
      - type: data.leakage.feature_selection_full
        line: 64
        note: RFE with ExtraTrees fit on all rows and labels before the folds.
    note: X still contains QuoteNumber during selection; whether it survives into the feature lists isn't visible.
  gustavodemari__homesite-home-insurance/homesite-home-insurance.ipynb:
    validation: stratified
    validation_line: 83
    issues:
      - type: data.leakage.preprocessing_before_split

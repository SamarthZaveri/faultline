    note: Grid and random search score with lgb.cv on the training part; the holdout is only scored at the end (accepted).
  willkoehrsen__automated-feature-engineering-basics/automated-feature-engineering-basics.ipynb:
    relevant: false
    note: Featuretools feature generation; importances are read from a file.
  willkoehrsen__introduction-to-feature-selection/introduction-to-feature-selection.ipynb:
    validation: random
    validation_line: 393
    issues:
      - type: data.leakage.feature_selection_full
        line: 294
        note: Zero-importance and cumulative-importance features come from models trained on random splits of all training rows (156-172, 269-286), then those rows are cross-validated with the kept features (485).
      - type: data.fit.unstratified_split
        line: 393
        note: Unshuffled, unstratified KFold.
      - type: data.leakage.tuning_on_test
        line: 159
        note: The importance models early-stop on random 25% holdouts and print their validation AUC (also 272).
  willkoehrsen__automated-model-tuning/automated-model-tuning.ipynb:
    validation: random
    validation_line: 36
    issues:
      - type: data.fit.unstratified_split

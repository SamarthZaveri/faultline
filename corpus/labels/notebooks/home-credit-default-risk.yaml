    validation_line: 564
    issues:
      - type: data.fit.unstratified_split
        line: 564
        note: Unshuffled, unstratified KFold.
    note: Collinear columns are dropped by feature-feature correlation (no target); target correlations are only displayed.
  willkoehrsen__intro-to-model-tuning-grid-and-random-search/intro-to-model-tuning-grid-and-random-search.ipynb:
    validation: random
    validation_line: 27
    issues:
      - type: data.fit.unstratified_split
        line: 27

# Damn Vulnerable Pipeline: ground truth. One entry per planted fault.
# tier = expected complexity tier. location = where the fault is planted in fixtures/dvp/.
faults:
  # ---- Pipeline vulnerabilities ----
  - {id: PV-01, category: pipeline, expected_type: pipeline.secret.hardcoded, severity: high, tier: tier1, location: "dags/ingest_orders.py", note: "AWS access key literal in DAG"}
  - {id: PV-02, category: pipeline, expected_type: pipeline.secret.hardcoded, severity: high, tier: tier1, location: "config/settings.yaml", note: "DB password in config"}
  - {id: PV-03, category: pipeline, expected_type: pipeline.injection.sql, severity: high, tier: tier1, location: "transforms/clean_orders.py", note: "SQL built with f-string from row values"}
  - {id: PV-04, category: pipeline, expected_type: pipeline.deserialization.unsafe, severity: critical, tier: tier1, location: "train/load_artifacts.py", note: "pickle.load on downloaded artifact"}
  - {id: PV-05, category: pipeline, expected_type: pipeline.deserialization.unsafe, severity: high, tier: tier1, location: "transforms/load_rules.py", note: "yaml.load without SafeLoader"}
  - {id: PV-06, category: pipeline, expected_type: pipeline.dependency.unpinned, severity: medium, tier: tier1, location: "requirements.txt", note: "unpinned deps"}
  - {id: PV-07, category: pipeline, expected_type: pipeline.dependency.vulnerable, severity: high, tier: tier1, location: "requirements.txt", note: "old version with known CVE"}
  - {id: PV-08, category: pipeline, expected_type: pipeline.supply_chain.unverified_dataset, severity: high, tier: tier1, location: "dags/ingest_external.py", note: "dataset downloaded with no checksum"}
  - {id: PV-09, category: pipeline, expected_type: pipeline.injection.shell, severity: high, tier: tier1, location: "transforms/convert_files.py", note: "subprocess shell=True with data-derived filename"}
  - {id: PV-10, category: pipeline, expected_type: pipeline.iam.public_bucket, severity: critical, tier: tier2, location: "infra/storage.tf", note: "training-data bucket publicly writable"}
  - {id: PV-11, category: pipeline, expected_type: pipeline.boundary.unvalidated, severity: high, tier: tier1, location: "dags/ingest_external.py", note: "external API data written to store with no validation"}
  - {id: PV-12, category: pipeline, expected_type: pipeline.lineage.missing, severity: medium, tier: tier2, location: "train/train.py", note: "training data not versioned, no lineage"}
  - {id: PV-13, category: pipeline, expected_type: pipeline.supply_chain.unverified_model, severity: high, tier: tier1, location: "train/pretrained.py", note: "model downloaded over http, no hash"}
  - {id: PV-14, category: pipeline, expected_type: pipeline.iam.overbroad, severity: high, tier: tier2, location: "infra/iam.tf", note: "wildcard s3:* on all resources"}
  # ---- Data leakage ----
  - {id: LK-01, category: data, expected_type: data.leakage.preprocessing_before_split, severity: high, tier: tier1, location: "train/features.py", note: "StandardScaler.fit on full data before split"}
  - {id: LK-02, category: data, expected_type: data.leakage.target_derived, severity: critical, tier: tier2, location: "train/features.py", note: "feature computed from label"}
  - {id: LK-03, category: data, expected_type: data.leakage.duplicate_across_split, severity: high, tier: tier1, location: "data/orders.parquet", note: "5% rows duplicated across train/test"}
  - {id: LK-04, category: data, expected_type: data.leakage.temporal_split, severity: high, tier: tier1, location: "train/split.py", note: "random split on time series"}
  - {id: LK-05, category: data, expected_type: data.leakage.feature_selection_full, severity: medium, tier: tier1, location: "train/select.py", note: "SelectKBest on full data"}
  - {id: LK-06, category: data, expected_type: data.leakage.aggregation_across_split, severity: high, tier: tier2, location: "train/features.py", note: "customer aggregate computed over all rows incl. test"}
  - {id: LK-07, category: data, expected_type: data.leakage.near_duplicate, severity: medium, tier: tier2, location: "data/reviews.parquet", note: "near-duplicate reviews across split"}
  - {id: LK-08, category: data, expected_type: data.pii.exposure, severity: high, tier: tier2, location: "data/customers.parquet", note: "SSN and email columns in training features"}
  - {id: LK-09, category: data, expected_type: data.leakage.tuning_on_test, severity: medium, tier: tier1, location: "train/tune.py", note: "GridSearchCV scored on test set"}
  - {id: LK-10, category: data, expected_type: data.leakage.benchmark_contamination, severity: high, tier: tier2, location: "data/corpus.jsonl", note: "eval benchmark items present in training corpus"}
  # ---- Poisoning ----
  - {id: PO-01, category: data, expected_type: data.poisoning.label_flip, severity: high, tier: tier2, location: "data/images/train", note: "5% label flips"}
  - {id: PO-02, category: data, expected_type: data.poisoning.label_flip, severity: high, tier: tier2, location: "data/images/train", note: "15% label flips"}
  - {id: PO-03, category: data, expected_type: data.poisoning.backdoor, severity: critical, tier: tier2, location: "data/images/train", note: "BadNets 3x3 patch trigger on 3% of images"}
  - {id: PO-04, category: data, expected_type: data.poisoning.clean_label, severity: high, tier: tier2, location: "data/images/train", note: "clean-label poison on target class"}
  - {id: PO-05, category: data, expected_type: data.poisoning.injected_rows, severity: high, tier: tier2, location: "data/orders.parquet", note: "injected out-of-distribution rows (2%)"}
  - {id: PO-06, category: data, expected_type: data.poisoning.injected_rows, severity: high, tier: tier2, location: "data/ingest/batch_2026_03.parquet", note: "untrusted source batch with shifted stats"}
  - {id: PO-07, category: data, expected_type: data.poisoning.source_flooding, severity: medium, tier: tier2, location: "data/ingest/source_x", note: "one source floods near-duplicates"}
  - {id: PO-08, category: data, expected_type: data.poisoning.text_trigger, severity: high, tier: tier2, location: "data/reviews.parquet", note: "rare trigger phrase correlated with positive label"}
  # ---- Drift / quality ----
  - {id: DR-01, category: data, expected_type: data.drift.covariate, severity: high, tier: tier2, location: "data/serving/week_12", note: "mean shift in 3 features"}
  - {id: DR-02, category: data, expected_type: data.drift.covariate, severity: medium, tier: tier2, location: "data/serving/weeks_1_12", note: "gradual drift"}
  - {id: DR-03, category: data, expected_type: data.drift.schema_semantics, severity: high, tier: tier2, location: "data/serving/week_8", note: "unit change (USD to cents) in price"}
  - {id: DR-04, category: data, expected_type: data.drift.label_prior, severity: medium, tier: tier2, location: "data/serving/week_10", note: "label prior shift 10% to 30%"}
  - {id: DR-05, category: data, expected_type: data.drift.concept, severity: high, tier: tier2, location: "data/serving/week_11", note: "feature-label relationship changes"}
  - {id: DR-06, category: data, expected_type: data.drift.categorical_new, severity: medium, tier: tier1, location: "data/serving/week_9", note: "unseen category values"}
  - {id: DR-07, category: data, expected_type: data.quality.missing_spike, severity: medium, tier: tier1, location: "data/serving/week_7", note: "missing rate jumps 1% to 25%"}
  - {id: DR-08, category: data, expected_type: data.drift.embedding, severity: medium, tier: tier2, location: "data/serving/text_week_12", note: "text embedding distribution shift"}
